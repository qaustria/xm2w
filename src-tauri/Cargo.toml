[package]
name = "xm2w"
version = "0.1.0"
description = "Endgame Gear XM2w 4K configurator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tiny_http = "0.12"

# Linux only
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lib]
name = "xm2w"
